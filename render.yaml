# Scalable Render configuration for the document catalog application
databases:
  - name: document-catalog-db
    region: oregon

services:
  # Redis instance for Celery
  - type: redis
    name: redis
    region: oregon
    plan: free
    ipAllowList: []

  # Main FastAPI Application
  - type: web
    name: document-catalog-app
    env: python
    region: oregon
    plan: standard
    buildCommand: |
      # set -e: without it a failing step is skipped and the deploy continues.
      # A failed `alembic upgrade head` once shipped code that assumed a schema
      # change which had not happened, and the app went live broken.
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
      # Best-effort, unlike a migration: a backfill that cannot finish should
      # not block a deploy. Logged, not fatal.
      python backfill_keyword_mappings.py || echo "WARNING: keyword mapping backfill failed; continuing"
    startCommand: |
      echo "Starting Document Catalog application..."
      echo "Environment: $ENVIRONMENT"
      echo "Session secret configured: $([ -n "$SESSION_SECRET_KEY" ] && echo "YES" || echo "NO")"
      echo "App password configured: $([ -n "$APP_PASSWORD" ] && echo "YES" || echo "NO")"
      echo "Require app auth: $REQUIRE_APP_AUTH"
      uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_URL
        fromDatabase:
          name: document-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_TYPE
        value: "s3"
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: REQUIRE_AUTH
        value: "false"
      - key: API_KEY
        value: ""
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: REQUIRE_APP_AUTH
        value: "true"
      - key: SESSION_TIMEOUT_HOURS
        value: "24"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_FOLDER_PATH
        value: "/Press Files 2019-2020/2026"

  # Celery Background Worker
  - type: worker
    name: celery-worker
    env: python
    region: oregon
    plan: standard
    buildCommand: |
      # set -e: without it a failing step is skipped and the deploy continues.
      # A failed `alembic upgrade head` once shipped code that assumed a schema
      # change which had not happened, and the app went live broken.
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
      # Best-effort, unlike a migration: a backfill that cannot finish should
      # not block a deploy. Logged, not fatal.
      python backfill_keyword_mappings.py || echo "WARNING: keyword mapping backfill failed; continuing"
    # concurrency=2, not 4: four children each rasterising PDF pages for OCR
    # exceeded the container's memory, and the process was being restarted every
    # ~5 minutes. Each restart discarded four documents' in-flight work, so the
    # lost throughput outweighed the parallelism — 53 documents/hour observed
    # against a theoretical ~250. Raise again only alongside a larger plan.
    startCommand: "celery -A worker.celery_app worker --loglevel=info --concurrency=2 --prefetch-multiplier=1"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "production"
      # Tunable from the dashboard without a redeploy — useful while sizing
      # memory against the OCR workload.
      - key: WORKER_MAX_TASKS_PER_CHILD
        value: "10"
      - key: DATABASE_URL
        fromDatabase:
          name: document-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: document-catalog-app
          envVarKey: SECRET_KEY
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STORAGE_TYPE
        value: "s3"
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SESSION_SECRET_KEY
        fromService:
          type: web
          name: document-catalog-app
          envVarKey: SESSION_SECRET_KEY
      - key: REQUIRE_APP_AUTH
        value: "true"
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_FOLDER_PATH
        value: "/Press Files 2019-2020/2026"

  # Celery Beat — fires the recovery cycle that sweeps abandoned documents back
  # into flight. Nothing else does this: with dispatch handled directly by each
  # producer, a document whose worker died has no other route back to the queue.
  #
  # Runs as its own service rather than `celery worker --beat` so that scaling
  # celery-worker past one instance cannot produce two schedulers racing. Does
  # not run migrations — celery-worker owns that, and two services applying them
  # concurrently is its own failure mode.
  - type: worker
    name: celery-beat
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: "celery -A worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # "worker", not "production": ENVIRONMENT=production routes config through
      # RenderSettings, which requires SECRET_KEY, ANTHROPIC_API_KEY,
      # OPENAI_API_KEY, APP_PASSWORD and SESSION_SECRET_KEY. Beat only publishes
      # a task name to the broker every two minutes — it never calls an LLM,
      # serves a request, or reads storage — so handing it those secrets widens
      # their blast radius for nothing. Same choice the dropbox-ingest cron makes.
      - key: ENVIRONMENT
        value: "worker"
      - key: DATABASE_URL
        fromDatabase:
          name: document-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString

  # Dropbox Ingestion Cron Job
  - type: cron
    name: dropbox-ingest
    env: python
    region: oregon
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: |
      set -e
      pip install --upgrade pip
      pip install -r requirements.txt
      alembic upgrade head
    startCommand: "python -m jobs.dropbox_ingest"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: "worker"
      - key: DATABASE_URL
        fromDatabase:
          name: document-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: STORAGE_TYPE
        value: "s3"
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: DROPBOX_APP_KEY
        sync: false
      - key: DROPBOX_APP_SECRET
        sync: false
      - key: DROPBOX_REFRESH_TOKEN
        sync: false
      - key: DROPBOX_FOLDER_PATH
        value: "/Press Files 2019-2020/2026"
